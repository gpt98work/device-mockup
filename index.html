document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Device Mockup<\u002Ftitle>\n<link rel=\"icon\" type=\"image/png\" href=\"f627ad38-03e5-4329-8641-48bdfbb4cb78\">\n<script src=\"2f8bbe85-1164-4489-948f-8b4c20b99edf\"><\u002Fscript>\n<script src=\"f2e3755f-02a3-4165-9970-8addbbbc4996\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<link rel=\"icon\" type=\"image/png\" href=\"f627ad38-03e5-4329-8641-48bdfbb4cb78\">\n<style>\nhtml,body{height:100%;margin:0}\nbody{font-family:ui-sans-serif,-apple-system,\"SF Pro Text\",\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;font-size:14px;line-height:1.45;color:#1c2128;background:#eef0f3;-webkit-font-smoothing:antialiased;overflow:hidden}\na{color:#2f62ff;text-decoration:none}\na:hover{color:#2453e0}\n*,*::before,*::after{box-sizing:border-box}\nbutton,input,select{font:inherit;color:inherit}\nbutton{cursor:pointer}\n:focus-visible{outline:2px solid #2f62ff;outline-offset:2px}\ninput[type=\"range\"]{accent-color:#2f62ff}\n@keyframes sfspin{to{transform:rotate(360deg)}}\n<\u002Fstyle>\n<style>[data-sf-root]{height:100dvh !important}\n@media (max-width:760px){\n  [data-sf-root]{grid-template-columns:minmax(0,1fr) !important;grid-template-rows:48px minmax(0,1.15fr) minmax(0,1fr) !important}\n  [data-sf-aside]{border-left:none !important;border-top:1px solid #e2e5eb !important}\n  [data-sf-meta]{display:none !important}\n  [data-sf-head]{overflow-x:auto}\n  [data-sf-aside] button{min-height:40px}\n  [data-sf-aside] input,[data-sf-aside] select{min-height:38px}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-sf-root=\"1\" style=\"height:100vh;display:grid;grid-template-rows:48px minmax(0,1fr);grid-template-columns:minmax(0,1fr) 340px;background:#eef0f3\">\n  <header data-sf-head=\"1\" style=\"grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;background:#ffffff;border-bottom:1px solid #e2e5eb\">\n    <img src=\"533ecfb1-cdc2-423c-91a8-35571ab238ec\" alt=\"Device Mockup\" style=\"height:22px;width:auto;display:block;flex:none\">\n    <div data-sf-meta=\"1\" style=\"flex:1;min-width:0;color:#7b8494;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums\">{{ fileMeta }}<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:6px\">\n      <button title=\"Undo (Z)\" aria-label=\"Undo\" disabled=\"{{ cantUndo }}\" sc-camel-on-click=\"{{ onUndo }}\" style=\"{{ undoStyle }}\" style-hover=\"background:#eef0f3\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:16px;height:16px;display:block\"><path d=\"M9 14 4 9l5-5\"><\u002Fpath><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <button title=\"Redo (Shift+Z)\" aria-label=\"Redo\" disabled=\"{{ cantRedo }}\" sc-camel-on-click=\"{{ onRedo }}\" style=\"{{ redoStyle }}\" style-hover=\"background:#eef0f3\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:16px;height:16px;display:block\"><path d=\"m15 14 5-5-5-5\"><\u002Fpath><path d=\"M20 9H10a6 6 0 0 0 0 12h3\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <div style=\"display:inline-flex;border:1px solid #e2e5eb;border-radius:8px;overflow:hidden\">\n        <button title=\"Zoom out (−)\" aria-label=\"Zoom out\" sc-camel-on-click=\"{{ onZoomOut }}\" style=\"height:30px;min-width:30px;padding:0 8px;border:0;background:#ffffff;color:#4a5260\" style-hover=\"background:#eef0f3\">−<\u002Fbutton>\n        <button title=\"Reset to 100% (0)\" sc-camel-on-click=\"{{ onZoom100 }}\" style=\"height:30px;min-width:58px;padding:0 8px;border:0;border-left:1px solid #e2e5eb;background:#ffffff;color:#4a5260;font-variant-numeric:tabular-nums\" style-hover=\"background:#eef0f3\">{{ zoomPct }}%<\u002Fbutton>\n        <button title=\"Zoom in (+)\" aria-label=\"Zoom in\" sc-camel-on-click=\"{{ onZoomIn }}\" style=\"height:30px;min-width:30px;padding:0 8px;border:0;border-left:1px solid #e2e5eb;background:#ffffff;color:#4a5260\" style-hover=\"background:#eef0f3\">+<\u002Fbutton>\n      <\u002Fdiv>\n      <button title=\"Fit to view (F)\" sc-camel-on-click=\"{{ onFit }}\" style=\"height:30px;padding:0 10px;border:1px solid #e2e5eb;background:#ffffff;border-radius:8px;color:#4a5260\" style-hover=\"background:#eef0f3\">Fit<\u002Fbutton>\n      <button title=\"Show or hide guides (H)\" aria-pressed=\"{{ guides }}\" sc-camel-on-click=\"{{ onGuides }}\" style=\"{{ guidesBtnStyle }}\">Guides<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <main ref=\"{{ stageRef }}\" sc-camel-on-pointer-down=\"{{ onStageDown }}\" sc-camel-on-pointer-move=\"{{ onStageMove }}\" sc-camel-on-pointer-up=\"{{ onStageUp }}\" sc-camel-on-pointer-cancel=\"{{ onStageUp }}\" sc-camel-on-double-click=\"{{ onStageDbl }}\" sc-camel-on-drag-over=\"{{ onStageDragOver }}\" sc-camel-on-drag-leave=\"{{ onStageDragLeave }}\" sc-camel-on-drop=\"{{ onStageDrop }}\" style=\"position:relative;background:#2b2e34;overflow:hidden;touch-action:none;user-select:none;min-width:0;min-height:0\">\n    <canvas ref=\"{{ viewRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\"><\u002Fcanvas>\n    <sc-if value=\"{{ showEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div style=\"width:min(440px,100%);border:1.5px dashed rgba(255,255,255,0.28);border-radius:14px;padding:36px 28px;text-align:center;color:#e6e8ec;background:rgba(255,255,255,0.03)\">\n          <svg sc-camel-view-box=\"0 0 64 64\" fill=\"none\" aria-hidden=\"true\" style=\"width:64px;height:64px;margin:0 auto;display:block\">\n            <rect x=\"14\" y=\"8\" width=\"36\" height=\"48\" rx=\"6\" stroke=\"#aab0bb\" stroke-width=\"2\"><\u002Frect>\n            <path d=\"M20 16.5 44 13v34l-24-3.5z\" fill=\"#2f62ff\" opacity=\"0.9\"><\u002Fpath>\n            <path d=\"M6 12V8a2 2 0 0 1 2-2h4M52 6h4a2 2 0 0 1 2 2v4M58 52v4a2 2 0 0 1-2 2h-4M12 58H8a2 2 0 0 1-2-2v-4\" stroke=\"#e6e8ec\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath>\n          <\u002Fsvg>\n          <h1 style=\"font-size:19px;font-weight:600;margin:14px 0 6px;letter-spacing:-0.01em\">Drop a device photo to start<\u002Fh1>\n          <p style=\"margin:0 0 18px;color:#aab0bb;font-size:13.5px\">Phone, tablet, laptop, TV, watch — any photo with a screen.<\u002Fp>\n          <div style=\"display:flex;gap:10px;justify-content:center;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ onChooseDevice }}\" style=\"height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:#2f62ff;color:#ffffff;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap\" style-hover=\"background:#2453e0\">Choose photo<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onSample }}\" style=\"height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.28);background:transparent;color:#e6e8ec;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap\" style-hover=\"background:rgba(255,255,255,0.08)\">Try a sample photo<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <canvas ref=\"{{ loupeRef }}\" width=\"150\" height=\"150\" aria-hidden=\"true\" style=\"position:absolute;width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 2px #ffffff,0 6px 24px rgba(0,0,0,0.45);pointer-events:none;display:none;background:#000000\"><\u002Fcanvas>\n    <sc-if value=\"{{ hint }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;left:12px;bottom:12px;padding:6px 10px;border-radius:8px;background:rgba(20,22,26,0.72);color:#cfd4dc;font-size:12px;pointer-events:none;max-width:calc(100% - 24px);backdrop-filter:blur(6px)\">{{ hint }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ busyText }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,46,52,0.55);color:#e6e8ec;font-size:13px\">\n        <span style=\"width:18px;height:18px;border:2px solid rgba(255,255,255,0.25);border-top-color:#ffffff;border-radius:50%;margin-right:10px;animation:sfspin 0.8s linear infinite\"><\u002Fspan>\n        <span>{{ busyText }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ toastMsg }}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"status\" aria-live=\"polite\" style=\"{{ toastStyle }}\">\n        <span>{{ toastMsg }}<\u002Fspan>\n        <sc-if value=\"{{ toastClosable }}\" hint-placeholder-val=\"{{ false }}\">\n          <button aria-label=\"Dismiss\" sc-camel-on-click=\"{{ onToastClose }}\" style=\"height:24px;width:24px;padding:0;border:0;border-radius:6px;background:transparent;color:#f1f3f6;font-size:16px;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center\" style-hover=\"background:rgba(255,255,255,0.14)\">×<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <aside data-sf-aside=\"1\" style=\"background:#f7f8fa;border-left:1px solid #e2e5eb;display:flex;flex-direction:column;min-height:0;min-width:0\">\n    <nav aria-label=\"Steps\" style=\"display:grid;grid-template-columns:repeat(4,1fr);background:#ffffff;border-bottom:1px solid #e2e5eb\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button disabled=\"{{ t.disabled }}\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\"><span style=\"{{ t.numStyle }}\">{{ t.n }}<\u002Fspan><span>{{ t.label }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"flex:1;min-height:0;overflow:auto;padding:16px 16px 20px\">\n      <sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n        <h2 style=\"font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em\">Device photo<\u002Fh2>\n        <p style=\"color:#4a5260;margin:0 0 14px;font-size:13px\">Any photo with a screen in it — lit or off, straight-on or at an angle.<\u002Fp>\n        <sc-if value=\"{{ noImg }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-drag-over=\"{{ onDzDragOver }}\" sc-camel-on-drop=\"{{ onDeviceDzDrop }}\" style=\"border:1.5px dashed #cfd5de;border-radius:12px;padding:18px 14px;text-align:center;background:#ffffff;color:#4a5260;font-size:13px;margin-bottom:14px\">\n            <p style=\"margin:0\">Drop a photo here<\u002Fp>\n            <div style=\"display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px\">\n              <button sc-camel-on-click=\"{{ onChooseDevice }}\" style=\"height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#1c2128;font-weight:500\" style-hover=\"background:#f6f7f9\">Choose photo<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onSample }}\" style=\"height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#1c2128;font-weight:500\" style-hover=\"background:#f6f7f9\">Use sample<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;background:#ffffff;border:1px solid #e2e5eb;border-radius:12px;margin-bottom:14px\">\n            <div aria-hidden=\"true\" style=\"{{ imgThumbStyle }}\"><\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ imgName }}<\u002Fdiv>\n              <div style=\"color:#7b8494;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ imgDims }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onChooseDevice }}\" style=\"height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#1c2128;font-weight:500\" style-hover=\"background:#f6f7f9\">Replace<\u002Fbutton>\n            <button title=\"Remove photo\" aria-label=\"Remove photo\" sc-camel-on-click=\"{{ onRemoveDevice }}\" style=\"height:30px;width:30px;padding:0;font-size:16px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#4a5260;flex:none\" style-hover=\"background:#fbe4e6;border-color:#f1c0c5;color:#c22f3c\">×<\u002Fbutton>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toStep2 }}\" style=\"height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:#2f62ff;color:#ffffff;font-weight:500\" style-hover=\"background:#2453e0\">Next: check the screen area<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em\">Screen area<\u002Fh2>\n        <p style=\"color:#4a5260;margin:0 0 14px;font-size:13px\">The four corners should sit exactly on the edges of the display.<\u002Fp>\n        <div style=\"margin:0 0 14px;border:1px solid #e2e5eb;border-radius:12px;background:#ffffff\">\n          <button aria-expanded=\"{{ cornersOpen }}\" sc-camel-on-click=\"{{ onToggleCorners }}\" style=\"width:100%;height:38px;padding:0 12px;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:#4a5260;border-radius:12px\" style-hover=\"background:#f6f7f9\">\n            <span>Corner positions <span style=\"color:#7b8494\">(pixels in the photo)<\u002Fspan><\u002Fspan>\n            <span style=\"{{ cornersChevronStyle }}\">›<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ cornersOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 12px 10px\">\n              <div style=\"display:grid;grid-template-columns:88px 1fr 1fr;gap:8px;margin-bottom:4px\">\n                <span><\u002Fspan><span style=\"font-size:11.5px;color:#7b8494\">X<\u002Fspan><span style=\"font-size:11.5px;color:#7b8494\">Y<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ cornerRows }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:88px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px\">\n                  <div sc-camel-on-click=\"{{ c.onSelect }}\" style=\"{{ c.labStyle }}\"><span style=\"width:8px;height:8px;border-radius:50%;background:#8fb0ff;border:1.5px solid #ffffff;box-shadow:0 0 0 1px #aab2bd;display:inline-block;flex:none\"><\u002Fspan><span>{{ c.label }}<\u002Fspan><\u002Fdiv>\n                  <input type=\"number\" step=\"1\" value=\"{{ c.x }}\" aria-label=\"{{ c.ariaX }}\" sc-camel-on-change=\"{{ c.onX }}\" sc-camel-on-focus=\"{{ c.onFocusX }}\" sc-camel-on-blur=\"{{ c.onBlur }}\" style=\"width:100%;height:30px;padding:0 8px;border:1px solid #e2e5eb;border-radius:8px;background:#ffffff;font-variant-numeric:tabular-nums;min-width:0\" style-focus=\"border-color:#2f62ff;outline:none\">\n                  <input type=\"number\" step=\"1\" value=\"{{ c.y }}\" aria-label=\"{{ c.ariaY }}\" sc-camel-on-change=\"{{ c.onY }}\" sc-camel-on-focus=\"{{ c.onFocusY }}\" sc-camel-on-blur=\"{{ c.onBlur }}\" style=\"width:100%;height:30px;padding:0 8px;border:1px solid #e2e5eb;border-radius:8px;background:#ffffff;font-variant-numeric:tabular-nums;min-width:0\" style-focus=\"border-color:#2f62ff;outline:none\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"margin:0 0 14px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px\">\n            <label style=\"font-size:12.5px;color:#4a5260\">Screen corner radius<\u002Flabel>\n            <button sc-camel-on-click=\"{{ onRadiusLink }}\" style=\"height:24px;padding:0 4px;border:0;background:transparent;color:#2f62ff;font-size:12px;font-weight:500;white-space:nowrap\" style-hover=\"color:#2453e0\">{{ radiusLinkLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ radiusLinked }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center\">\n              <input type=\"range\" sc-camel-on-pointer-down=\"{{ stopProp }}\" min=\"0\" max=\"25\" step=\"0.5\" value=\"{{ radiusPct }}\" sc-camel-on-change=\"{{ onRadius }}\" sc-camel-on-pointer-up=\"{{ onRadiusCommit }}\" style=\"width:100%\">\n              <output style=\"font-size:13px;color:#4a5260;text-align:right;font-variant-numeric:tabular-nums\">{{ radiusPct }}%<\u002Foutput>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ radiusSplit }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n              <sc-for list=\"{{ radiusRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:#7b8494\">\n                  <span style=\"width:56px;flex:none\">{{ r.label }}<\u002Fspan>\n                  <input type=\"number\" min=\"0\" max=\"25\" step=\"0.5\" value=\"{{ r.v }}\" aria-label=\"{{ r.aria }}\" sc-camel-on-change=\"{{ r.onChange }}\" style=\"width:100%;min-width:0;height:30px;padding:0 8px;border:1px solid #e2e5eb;border-radius:8px;background:#ffffff;font-variant-numeric:tabular-nums;color:#1c2128\" style-focus=\"border-color:#2f62ff;outline:none\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"color:#7b8494;font-size:12.5px;margin:6px 0 0\">Percent of the screen's short side.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"margin:0 0 14px\">\n          <div style=\"font-size:12.5px;color:#4a5260;margin-bottom:6px\">Camera cutout<\u002Fdiv>\n          <sc-if value=\"{{ hasCutouts }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#1c2128;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ cutoutsOn }}\" sc-camel-on-change=\"{{ onCutoutsToggle }}\" style=\"width:15px;height:15px;accent-color:#2f62ff\"> Keep it visible ({{ cutoutLabel }})<\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noCutouts }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"color:#7b8494;font-size:12.5px;margin:0\">None found at the top of the screen. Punch holes and notches only show up when the screen in the photo is lit.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:6px\">\n          <button sc-camel-on-click=\"{{ onRedetect }}\" style=\"height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#1c2128;font-weight:500\" style-hover=\"background:#f6f7f9\">Detect again<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onResetCorners }}\" style=\"height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#1c2128;font-weight:500\" style-hover=\"background:#f6f7f9\">Reset corners<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"color:#7b8494;font-size:12.5px;margin:10px 0 0\">Drag a corner to move it; the loupe shows the photo underneath so you can land on the glass edge. Arrow keys nudge the selected corner by 1 px (Shift for 10). Drag inside the screen to move all four together.<\u002Fp>\n        <div style=\"height:1px;background:#e2e5eb;margin:16px 0\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toStep3 }}\" style=\"height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:#2f62ff;color:#ffffff;font-weight:500\" style-hover=\"background:#2453e0\">Next: add screen content<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em\">Screen content<\u002Fh2>\n        <p style=\"color:#4a5260;margin:0 0 14px;font-size:13px\">Your UI screenshot. It is warped to the screen's perspective automatically.<\u002Fp>\n        <sc-if value=\"{{ noShot }}\" hint-placeholder-val=\"{{ true }}\">\n          <div sc-camel-on-drag-over=\"{{ onDzDragOver }}\" sc-camel-on-drop=\"{{ onShotDzDrop }}\" style=\"border:1.5px dashed #cfd5de;border-radius:12px;padding:18px 14px;text-align:center;background:#ffffff;color:#4a5260;font-size:13px;margin-bottom:14px\">\n            <p style=\"margin:0\">Drop a screenshot here<\u002Fp>\n            <div style=\"display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px\">\n              <button sc-camel-on-click=\"{{ onChooseShot }}\" style=\"height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#1c2128;font-weight:500\" style-hover=\"background:#f6f7f9\">Choose screenshot<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasShot }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;background:#ffffff;border:1px solid #e2e5eb;border-radius:12px;margin-bottom:14px\">\n            <div aria-hidden=\"true\" style=\"{{ shotThumbStyle }}\"><\u002Fdiv>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ shotName }}<\u002Fdiv>\n              <div style=\"color:#7b8494;font-size:12.5px;font-variant-numeric:tabular-nums\">{{ shotDims }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onChooseShot }}\" style=\"height:30px;padding:0 10px;font-size:13px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#1c2128;font-weight:500\" style-hover=\"background:#f6f7f9\">Replace<\u002Fbutton>\n            <button title=\"Remove screenshot\" aria-label=\"Remove screenshot\" sc-camel-on-click=\"{{ onRemoveShot }}\" style=\"height:30px;width:30px;padding:0;font-size:16px;border-radius:8px;border:1px solid #cfd5de;background:#ffffff;color:#4a5260;flex:none\" style-hover=\"background:#fbe4e6;border-color:#f1c0c5;color:#c22f3c\">×<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin:0 0 14px\">\n            <div style=\"font-size:12.5px;color:#4a5260;margin-bottom:6px\">Fit<\u002Fdiv>\n            <div style=\"display:flex;border:1px solid #cfd5de;border-radius:8px;overflow:hidden;background:#ffffff\">\n              <sc-for list=\"{{ fitSeg }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"color:#7b8494;font-size:12.5px;margin:6px 0 0\">{{ fitTip }}<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showAlign }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin:0 0 14px\">\n              <div style=\"font-size:12.5px;color:#4a5260;margin-bottom:6px\">{{ alignLabel }}<\u002Fdiv>\n              <div style=\"display:flex;border:1px solid #cfd5de;border-radius:8px;overflow:hidden;background:#ffffff\">\n                <sc-for list=\"{{ alignSeg }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin:0 0 14px\">\n            <label style=\"display:block;font-size:12.5px;color:#4a5260;margin-bottom:6px\">Keep the photo's reflections<\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center\">\n              <input type=\"range\" sc-camel-on-pointer-down=\"{{ stopProp }}\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ reflect }}\" sc-camel-on-change=\"{{ onReflect }}\" style=\"width:100%\">\n              <output style=\"font-size:13px;color:#4a5260;text-align:right;font-variant-numeric:tabular-nums\">{{ reflect }}%<\u002Foutput>\n            <\u002Fdiv>\n            <p style=\"color:#7b8494;font-size:12.5px;margin:6px 0 0\">Blends highlights and glare from the original screen over your UI so the result looks photographed rather than pasted.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"margin:0 0 14px\">\n            <label style=\"display:block;font-size:12.5px;color:#4a5260;margin-bottom:6px\">Edge softness<\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center\">\n              <input type=\"range\" sc-camel-on-pointer-down=\"{{ stopProp }}\" min=\"0\" max=\"30\" step=\"1\" value=\"{{ feather }}\" sc-camel-on-change=\"{{ onFeather }}\" style=\"width:100%\">\n              <output style=\"font-size:13px;color:#4a5260;text-align:right;font-variant-numeric:tabular-nums\">{{ feather }} px<\u002Foutput>\n            <\u002Fdiv>\n            <p style=\"color:#7b8494;font-size:12.5px;margin:6px 0 0\">Feathers the screen edge into the photo so it doesn't look pasted on. A few pixels is usually enough.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:#e2e5eb;margin:16px 0\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toStep4 }}\" style=\"height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:#2f62ff;color:#ffffff;font-weight:500\" style-hover=\"background:#2453e0\">Next: export<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em\">Export<\u002Fh2>\n        <p style=\"color:#4a5260;margin:0 0 14px;font-size:13px\">Saved at the photo's own resolution unless you pick a smaller size.<\u002Fp>\n        <div style=\"margin:0 0 14px\">\n          <label style=\"display:block;font-size:12.5px;color:#4a5260;margin-bottom:6px\">Size<\u002Flabel>\n          <sc-raw-select value=\"{{ exportScale }}\" sc-camel-on-change=\"{{ onExportScale }}\" style=\"width:100%;height:32px;padding:0 8px;border:1px solid #cfd5de;border-radius:8px;background:#ffffff;font-variant-numeric:tabular-nums\">\n            <sc-for list=\"{{ sizeOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n              <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"margin:0 0 14px\">\n          <div style=\"font-size:12.5px;color:#4a5260;margin-bottom:6px\">Format<\u002Fdiv>\n          <div style=\"display:flex;border:1px solid #cfd5de;border-radius:8px;overflow:hidden;background:#ffffff\">\n            <sc-for list=\"{{ fmtSeg }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showQuality }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:0 0 14px\">\n            <label style=\"display:block;font-size:12.5px;color:#4a5260;margin-bottom:6px\">{{ qualityLabel }}<\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr .invalidateLayer(); this.requestRender();\n  }\n\n  /* ------- bezel (glass edge -> display inset) ------- */\n  syncBase() {\n    if (!this.quad || !this.E) return;\n    const pct = this.state.bezelPct || 0;\n    if (pct <= 0) { this.baseQuad = this.quad.map(p => [p[0], p[1]]); return; }\n    const [w, h] = this.E.quadNominalSize(this.quad);\n    const d = pct / 100 * Math.min(w, h);\n    this.baseQuad = this.E.Detect.insetQuad(this.quad, -d) || this.quad.map(p => [p[0], p[1]]);\n  }\n  applyBezel(pct) {\n    if (!this.baseQuad || !this.E) return;\n    const [w, h] = this.E.quadNominalSize(this.baseQuad);\n    const minB = Math.min(w, h);\n    const d = pct / 100 * minB / (1 + 2 * pct / 100);\n    const q = d > 0 ? this.E.Detect.insetQuad(this.baseQuad, d) : null;\n    this.quad = q || this.baseQuad.map(p => [p[0], p[1]]);\n    this.setState({ bezelPct: pct, tick: this.state.tick + 1 });\n    this.invalidateLayer(); this.requestRender();\n  }\n  scheduleCutouts() {\n    clearTimeout(this._cutTimer);\n    this._cutTimer = setTimeout(() => this.updateCutouts(), 120);\n  }\n  undo = () => { if (this.history.length < 2) return; this.future.push(this.history.pop()); this.restore(this.history[this.history.length - 1]); this.refreshHistory(); }\n  redo = () => { if (!this.future.length) return; const s = this.future.pop(); this.history.push(s); this.restore(s); this.refreshHistory(); }\n  refreshHistory() { this.setState({ canUndo: this.history.length >= 2, canRedo: this.future.length > 0 }); }\n\n  /* ------- view transform ------- */\n  stageSize() { const r = this.stageRef.current.getBoundingClientRect(); return [r.width, r.height]; }\n  toScreen(p) { return [p[0] * this.view.s + this.view.tx, p[1] * this.view.s + this.view.ty]; }\n  toImage(x, y) { return [(x - this.view.tx) / this.view.s, (y - this.view.ty) / this.view.s]; }\n  fitView = () => {\n    if (!this.img) return;\n    const [sw, sh] = this.stageSize();\n    const s = Math.min(sw / this.W, sh / this.H) * 0.9
